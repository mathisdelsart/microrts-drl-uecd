# Skip vendored bot code (third-party, frozen), the vendored MicroRTS engine
# (maps + .jar), the frozen LaTeX thesis + CoG paper, and curated shipped data
# artefacts. These mirror the linguist-vendored / linguist-documentation marks
# in .gitattributes. dissertation/figs/figs-python/ is the only carve-out:
# those scripts are functional code, they get linted/formatted like the rest.
exclude: |
  (?x)^(
    microrts_agent/bots/.*|
    microrts_agent/microrts/(microrts\.jar|maps/|lib/).*|
    dissertation/(?!figs/figs-python/).*|
    cog-2026-paper/.*|
    data/.*
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=99000]
      - id: check-merge-conflict
