[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microrts-agent"
version = "0.1.0"
description = "Deep-RL agent for MicroRTS (UCLouvain master's thesis)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mathis Delsart", email = "mathis.delsart@gmail.com" }]
keywords = [
    "Reinforcement Learning",
    "Deep Reinforcement Learning",
    "Proximal Policy Optimization",
    "Self-Play",
    "Behavior Cloning",
    "Reward Shaping",
    "Transformer",
    "Game-Theoretic Evaluation",
    "MicroRTS",
    "Real-Time Strategy Games",
    "PyTorch",
    "Master's Thesis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

# Core stack: training (PPO), evaluation, tournaments, plotting.
dependencies = [
    "torch>=2.0",
    "numpy<2",
    "stable-baselines3",
    "tensorboard",
    "JPype1",
    "Pillow",
    "matplotlib",
    "scipy",
    "seaborn",
    "pandas",
    "rich",
    "moviepy",
]

[project.optional-dependencies]
# Runtime deps for the RAISocketAI tournament bot. The bot's own wheel
# (rl_algo_impls) is installed separately, with --no-deps, from
# microrts_agent/bots/RAISocketAI/ — its pinned
# dependency set conflicts with the core stack, so the setup scripts install
# the wheel without deps and rely on the cherry-picked subset listed here.
tournament = [
    "gymnasium==0.29.1",
    "psutil",
    "PyYAML",
    "tqdm",
    "einops",
    "torchvision",
    "accelerate",
    "wandb",
    "GPUtil",
    "moviepy",
    "pyvirtualdisplay",
]
dev = ["ruff==0.15.14", "pytest>=8", "pytest-timeout>=2", "PyYAML", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/mathisdelsart/microrts-drl-uecd"
Repository = "https://github.com/mathisdelsart/microrts-drl-uecd"
Issues = "https://github.com/mathisdelsart/microrts-drl-uecd/issues"
Documentation = "https://mathisdelsart.github.io/microrts-drl-uecd-website/"

# microrts_agent is the importable package (run via `python -m microrts_agent <cmd>`
# after `pip install -e .`). The vendored competition bots and the Java engine are
# data/source trees, not Python packages, so they are excluded from discovery.
[tool.setuptools.packages.find]
include = ["microrts_agent*"]
exclude = ["microrts_agent.bots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Make tests work without `pip install -e .` by adding the repo root.
pythonpath = ["."]
# Per-test default timeout — catches CI hangs at <2× the slowest expected test.
timeout = 300
addopts = "-q --strict-markers"
