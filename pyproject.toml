[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microrts-agent"
version = "0.1.0"
description = "Deep-RL agent for MicroRTS (UCLouvain master's thesis)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mathis Delsart", email = "mathis.delsart@gmail.com" }]

# Core stack: training (PPO), evaluation, tournaments, plotting.
dependencies = [
    "torch>=2.0",
    "numpy<2",
    "gym==0.23.1",
    "stable-baselines3",
    "tensorboard",
    "JPype1",
    "Pillow",
    "matplotlib",
    "scipy",
    "seaborn",
    "pandas",
    "rich",
    "pettingzoo==1.24.3",
    "moviepy",
]

[project.optional-dependencies]
# Runtime deps for the RAISocketAI tournament bot. The bot's own wheel
# (rl_algo_impls) is installed separately, with --no-deps, from
# microrts_agent/bots/RAISocketAI/ — its pinned
# dependency set conflicts with the core stack, so the setup scripts install
# the wheel without deps and rely on the cherry-picked subset listed here.
tournament = [
    "gymnasium==0.29.1",
    "psutil",
    "PyYAML",
    "tqdm",
    "einops",
    "torchvision",
    "accelerate",
    "wandb",
    "GPUtil",
    "moviepy",
    "pyvirtualdisplay",
]
dev = ["ruff==0.15.14", "pytest>=8", "pytest-timeout>=2"]

# microrts_agent is the importable package (run via `python -m microrts_agent <cmd>`
# after `pip install -e .`). The vendored competition bots and the Java engine are
# data/source trees, not Python packages, so they are excluded from discovery.
[tool.setuptools.packages.find]
include = ["microrts_agent*"]
exclude = ["microrts_agent.bots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Make tests work without `pip install -e .` by adding the repo root.
pythonpath = ["."]
# Per-test default timeout — catches CI hangs at <2× the slowest expected test.
timeout = 300
addopts = "-q --strict-markers"
