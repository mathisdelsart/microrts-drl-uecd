[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microrts-agent"
version = "0.1.0"
description = "Deep-RL agent for MicroRTS (UCLouvain master's thesis)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mathis Delsart", email = "mathis.delsart@gmail.com" }]

# Core stack: training (PPO), evaluation, tournaments, plotting.
dependencies = [
    "torch>=2.0",
    "numpy<2",
    "gym==0.23.1",
    "stable-baselines3",
    "tensorboard",
    "JPype1",
    "Pillow",
    "matplotlib",
    "scipy",
    "seaborn",
    "pandas",
    "rich",
    "pettingzoo==1.24.3",
]

[project.optional-dependencies]
# Runtime deps for the RAISocketAI tournament bot. The bot's own wheel
# (rl_algo_impls) is installed separately, with --no-deps, from
# microrts_agent/tournaments/competition_winners/RAISocketAI/ — its pinned
# dependency set conflicts with the core stack, so the setup scripts install
# the wheel without deps and rely on the cherry-picked subset listed here.
tournament = [
    "gymnasium==0.29.1",
    "psutil",
    "PyYAML",
    "tqdm",
    "einops",
    "torchvision",
    "accelerate",
    "wandb",
    "GPUtil",
    "moviepy",
    "pyvirtualdisplay",
]
dev = ["ruff==0.15.14"]

# The code currently runs from source (python microrts_agent/train.py) and is
# not yet an importable package. pyproject.toml exists to declare dependencies
# in one place so `pip install -e ".[tournament]"` provisions the environment;
# it packages no modules.
[tool.setuptools]
packages = []
