name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please skim the dissertation (`dissertation/dissertation.pdf`) and the open issues — many ideas are already discussed there.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's painful? Concrete examples beat abstract wishes.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which area is touched? (training / envs / architectures / tournament / bridge / docs / CI / other)
    validations:
      required: true
